<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>获取验证码</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white p-7 rounded-xl shadow-lg">
  <h2 class="text-xl font-bold text-center mb-6">短信验证码获取</h2>
  <div class="mb-4">
    <label class="text-sm font-medium block mb-1">接收短信手机号</label>
    <input readonly id="telBox" class="w-full bg-gray-100 border px-3 py-2 rounded">
  </div>
  <div class="mb-6">
    <label class="text-sm font-medium block mb-1">验证码结果</label>
    <input readonly id="codeBox" class="w-full bg-gray-100 border px-3 py-2 rounded">
  </div>
  <button id="fetchBtn" onclick="getCode()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">获取验证码(调用API-B)</button>
</div>

<script>
// 读取URL里的随机key
function getUrlParam(name){
  let search = new URLSearchParams(location.search);
  return search.get(name);
}
let key = getUrlParam('key');
let tel = localStorage.getItem('tel_' + key);

// 无密钥/密钥不存在
if(!tel){
  document.body.innerHTML = `<div class="p-10 text-center text-red-500 text-lg">链接无效或已过期</div>`;
}else{
  document.getElementById('telBox').value = tel;
}

// 模拟API-B 请求验证码
async function getCode(){
  let btn = document.getElementById('fetchBtn');
  btn.disabled = true;
  btn.innerText = '正在请求验证码...';
  await new Promise(res=>setTimeout(res,1200));
  // 模拟6位验证码
  let code = Math.floor(100000 + Math.random()*900000);
  document.getElementById('codeBox').value = code;
  btn.disabled = false;
  btn.innerText = '获取验证码(调用API-B)';
}
</script>
</body>
</html>
