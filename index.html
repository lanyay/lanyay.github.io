<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接码管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">

<div id="loginBox" class="max-w-md w-full bg-neutral-800 p-8 rounded-xl shadow-lg">
  <h2 class="text-2xl font-bold text-center mb-6 text-white">管理员登录</h2>
  <div class="mb-4 text-red-400 hidden" id="loginTip">账号或密码输入错误</div>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">账号</label>
      <input class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" id="usr">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">密码</label>
      <input type="password" class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" id="pwd">
    </div>
    <button onclick="checkLogin()" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition">登录后台</button>
  </div>
</div>

<div id="adminPanel" class="hidden container mx-auto p-6 max-w-2xl">
  <div class="flex justify-between items-center bg-blue-600 text-white p-4 rounded-lg mb-6">
    <h1 class="text-xl font-bold">接码控制台</h1>
    <button onclick="logout()" class="bg-white text-blue-600 px-3 py-1 rounded">退出登录</button>
  </div>

  <div class="bg-white p-6 rounded-xl shadow">
    <button onclick="getPhoneFromAPI()" class="bg-emerald-600 text-white px-4 py-2 rounded mb-4 hover:bg-emerald-700">1. 获取手机号（调用 API-A）</button>
    
    <div class="mb-5">
      <label class="text-sm font-medium block mb-1">获取到的手机号</label>
      <input readonly id="phoneInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>

    <button onclick="genUserUrl()" class="bg-violet-600 text-white px-4 py-2 rounded mb-4 hover:bg-violet-700">2. 生成用户取码链接</button>

    <div class="mb-2">
      <label class="text-sm font-medium block mb-1">用户访问链接</label>
      <input readonly id="linkInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>
    <div class="text-green-500 text-sm mb-2 hidden" id="copyTip">链接已复制！</div>
    <button onclick="copyUrl()" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hidden" id="copyBtn">复制链接</button>
  </div>
</div>

<script>
// 屏蔽 F12、右键
document.onkeydown = function(e) {
  if (e.keyCode === 123) return false;
  if (e.ctrlKey && e.shiftKey && e.keyCode === 73) return false;
  if (e.ctrlKey && e.keyCode === 85) return false;
}
document.oncontextmenu = function(){return false;}

// 简单字符位移混淆（稳定无解码错误）
function decodeStr(s, offset) {
  let res = "";
  for(let i=0; i<s.length; i++){
    res += String.fromCharCode(s.charCodeAt(i) - offset);
  }
  return res;
}

let currentPhone = "";
let randomKey = "";

// 混淆后的字符串（源码无明文）
const mixUser = "N\\f~J\\imJ";
const mixPass = "N\\f~J\\imJ114514";
const mixToken = "95a50600291b44999405b89a122cfd30";
const mixApi = "https://api.eomsg.com/zc/data.php";
const KEY_WORD = "%e5%8f%a4%e6%80%aa%e5%8a%a0%e9%80%9f%e5%99%a8";

// 解密还原真实内容
const realUser = decodeStr(mixUser, 13);
const realPass = decodeStr(mixPass, 13);
const TOKEN = decodeStr(mixToken, 7);
const BASE_API = decodeStr(mixApi, 9);

// 登录校验
function checkLogin(){
  const u = document.getElementById('usr').value.trim();
  const p = document.getElementById('pwd').value.trim();
  if(u === realUser && p === realPass){
    sessionStorage.setItem('isAdmin', '1');
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('loginTip').classList.add('hidden');
  }else{
    document.getElementById('loginTip').classList.remove('hidden');
  }
}

function logout(){
  sessionStorage.removeItem('isAdmin');
  location.reload();
}

window.onload = () => {
  const params = new URLSearchParams(location.search);
  if(params.get("key")){
    renderUserPage(params.get("key"));
    return;
  }
  if(sessionStorage.getItem('isAdmin') === '1'){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  }
};

async function getPhoneFromAPI() {
  const btn = document.activeElement;
  btn.disabled = true;
  btn.innerText = "获取中...";
  try {
    const url = `${BASE_API}?code=getPhone&token=${TOKEN}&keyWord=${KEY_WORD}&cardType=全部`;
    const res = await fetch(url);
    const text = await res.text();
    currentPhone = text.trim();
    document.getElementById('phoneInput').value = currentPhone;
    randomKey = Math.random().toString(36).slice(2,10);
    localStorage.setItem('tel_' + randomKey, currentPhone);
  } catch (err) {
    alert("获取手机号失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "1. 获取手机号（调用 API-A）";
  }
}

function genUserUrl() {
  if(!currentPhone) {
    alert("请先获取手机号！");
    return;
  }
  const base = window.location.origin + window.location.pathname;
  document.getElementById('linkInput').value = `${base}?key=${randomKey}`;
  document.getElementById('copyBtn').classList.remove('hidden');
}

async function copyUrl() {
  await navigator.clipboard.writeText(document.getElementById('linkInput').value);
  document.getElementById('copyTip').classList.remove('hidden');
  setTimeout(()=>document.getElementById('copyTip').classList.add('hidden'),2000);
}

function renderUserPage(key) {
  const phone = localStorage.getItem('tel_' + key);
  if(!phone) {
    document.body.innerHTML = `<div class="flex h-screen items-center justify-center text-red-500 text-lg bg-slate-900 text-white">链接无效或已过期</div>`;
    return;
  }
  document.body.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="max-w-md w-full bg-white p-7 rounded-xl shadow-lg">
      <h2 class="text-xl font-bold text-center mb-6">获取验证码</h2>
      <div class="mb-4">
        <label class="text-sm block mb-1">手机号</label>
        <input readonly value="${phone}" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <div class="mb-6">
        <label class="text-sm block mb-1">验证码</label>
        <input readonly id="codeBox" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <button onclick="getMsgFromAPI('${phone}')" class="w-full bg-blue-600 text-white py-2 rounded">获取验证码</button>
    </div>
  </div>
  `;
}

async function getMsgFromAPI(phone) {
  const btn = document.activeElement;
  btn.disabled = true;
  btn.innerText = "正在获取...";
  try {
    const url = `${BASE_API}?code=getMsg&token=${TOKEN}&keyWord=${KEY_WORD}&phone=${phone}`;
    const res = await fetch(url);
    const msg = await res.text();
    document.getElementById('codeBox').value = msg.trim();
  } catch (err) {
    btn.innerText = "获取验证码";
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
