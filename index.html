<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感谢使用</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f1f5f9;min-height:100vh;padding:20px}
.card{max-width:960px;margin:40px auto;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:30px}
h2{text-align:center;margin-bottom:24px;color:#1e293b}
.form-item{margin-bottom:16px}
label{display:block;font-size:14px;color:#475569;margin-bottom:6px}
input{width:100%;height:40px;padding:0 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;outline:none}
input:focus{border-color:#3b82f6}
button{width:100%;height:42px;background:#3b82f6;color:#fff;border:none;border-radius:6px;font-size:15px;cursor:pointer;transition:background .2s}
button:hover{background:#2563eb}
button:disabled{background:#94a3b8;cursor:not-allowed}
.tip{text-align:center;margin-top:12px;font-size:14px}
.tip.error{color:#ef4444}
.tip.warn{color:#f59e0b}
.hidden{display:none}
.btn-group{display:flex;gap:10px;margin-top:8px}
.btn-group button{flex:1}
.switch-btn{background:#64748b}
.switch-btn:hover{background:#475569}
.switch-btn:disabled{background:#cbd5e1}
.project-box{border:2px solid #e2e8f0;border-radius:10px;padding:24px;background:#f8fafc;margin-top:20px}
.project-title{font-size:20px;font-weight:600;color:#1e293b;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.add-segment-area{display:flex;gap:10px;margin-bottom:20px;align-items:flex-end}
.add-segment-area > div{flex:1}
.add-segment-area button{max-width:120px;height:40px}
.segment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.segment-card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.04);position:relative}
.segment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.segment-title{font-size:16px;font-weight:600;color:#2563eb}
.del-btn{width:28px;height:28px;font-size:18px;line-height:1;background:#ef4444;border-radius:4px;padding:0}
.del-btn:hover{background:#dc2626}
.segment-input{margin-bottom:12px}
.phone-list{margin-top:14px;max-height:240px;overflow-y:auto}
.phone-item{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:8px}
.phone-item input{flex:1;background:#f8fafc;font-size:13px;height:34px}
.phone-item button{width:auto;padding:0 10px;height:32px;font-size:12px}
.batch-copy-btn{margin-top:10px;background:#10b981}
.batch-copy-btn:hover{background:#059669}
.batch-copy-btn:disabled{background:#94a3b8}
.logout-btn{background:#64748b;margin-bottom:20px}
.logout-btn:hover{background:#475569}
.load-project-btn{max-width:200px}
</style>
</head>
<body>

<div id="loginBox" class="card">
  <h2>管理员登录</h2>
  <div class="form-item">
    <label>账号</label>
    <input id="usr" placeholder="请输入管理员账号">
  </div>
  <div class="form-item">
    <label>密码</label>
    <input id="pwd" type="password" placeholder="请输入管理员密码">
  </div>
  <button onclick="checkLogin()">登录</button>
  <div id="loginTip" class="tip error hidden">账号密码错误</div>
</div>

<div id="adminPanel" class="card hidden">
  <button class="logout-btn" onclick="logout()">退出登录</button>
  <h2>管理后台</h2>
  <div class="form-item">
    <label>项目ID（sid）</label>
    <div style="display:flex;gap:10px">
      <input id="sidInput" value="64990" placeholder="请输入项目ID">
      <button class="load-project-btn" onclick="loadProject()">加载项目</button>
    </div>
  </div>

  <div id="projectBox" class="project-box hidden">
    <div class="project-title">
      <span>项目ID：<span id="projectSid"></span></span>
    </div>
    <div class="add-segment-area">
      <div>
        <label>新增号段（留空为通用默认）</label>
        <input id="segmentInput" placeholder="留空使用默认接口，或输入3位号段如151" maxlength="3">
      </div>
      <button onclick="addSegment()">添加号段</button>
    </div>
    <div class="segment-grid" id="segmentGrid"></div>
  </div>
</div>

<script>
const _k = 37;
const _d = s => {let r="";for(let c of s)r+=String.fromCharCode(c.charCodeAt(0)^_k);return r};

const ADMIN_USER = _d(String.fromCharCode(105,68,95,92,103,76,66,110,76,75,66));
const ADMIN_PASS = _d(String.fromCharCode(105,68,95,92,103,76,66,110,76,75,66,20,20,17,16,20,17));
const API_BASE = _d(String.fromCharCode(77,81,81,85,86,31,10,10,68,85,76,11,77,68,74,95,77,80,72,68,11,70,74,72,10,86,72,86,10));
const API_TOKEN = _d(String.fromCharCode(20,23,28,18,28,67,17,64,71,68,71,18,70,67,67,67,17,20,17,71,21,65,64,16,70,16,64,67,16,70,67,19,18,65,67,17,17,20,16,70,20,68,19,21,22,67,21,18,21,16,23,23,64,64,29,70,67,67,28,17,70,23,67,64,17,67,23,18,28,22,17,21,18,71,70,22,20,23,20,18,29,67,18,67,65,70,65,65,17,71,68,18,28,22,22,22,18,23,29,28,23,16,20,67,19,19,16,65,17,22,68,19,21,23,68,70,29,16,18,22,18,68,18,68,21,23,21,68,70,23,18,71,68,23,22,21,17,65,29,65,18,23,19,23,71,70,22,22,70,23,16,20,19,71,21,29,21,67,16,18,17,64,67,16,65,68,16,23,19,67,17,19,21,29,67,20));

let currentSid = "";

document.onkeydown = e => {
  if(e.keyCode === 123) return false;
  if(e.ctrlKey && e.shiftKey && e.keyCode === 73) return false;
  if(e.ctrlKey && e.keyCode === 85) return false;
}
document.oncontextmenu = () => false;

function checkLogin(){
  const u = document.getElementById('usr').value.trim();
  const p = document.getElementById('pwd').value.trim();
  if(u === ADMIN_USER && p === ADMIN_PASS){
    sessionStorage.setItem('isLogin', '1');
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('loginTip').classList.add('hidden');
  }else{
    document.getElementById('loginTip').classList.remove('hidden');
  }
}

function logout(){
  sessionStorage.removeItem('isLogin');
  location.reload();
}

window.onload = () => {
  const key = new URLSearchParams(location.search).get('key');
  if(key){
    renderUserPage(key);
    return;
  }
  if(sessionStorage.getItem('isLogin') === '1'){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  }
}

function loadProject(){
  const sid = document.getElementById('sidInput').value.trim();
  if(!sid) return alert('请输入项目ID');
  currentSid = sid;
  document.getElementById('projectSid').innerText = sid;
  document.getElementById('projectBox').classList.remove('hidden');
  document.getElementById('segmentGrid').innerHTML = '';
  document.getElementById('segmentInput').value = '';
}

function addSegment(){
  const prefix = document.getElementById('segmentInput').value.trim();
  if(prefix && !/^\d{3}$/.test(prefix)){
    alert('请输入正确的手机号前3位（3位数字），或留空使用默认接口');
    return;
  }
  const grid = document.getElementById('segmentGrid');
  const card = document.createElement('div');
  card.className = 'segment-card';
  card.dataset.prefix = prefix;
  const title = prefix ? `${prefix} 号段` : '通用号段（默认接口）';
  card.innerHTML = `
    <div class="segment-header">
      <div class="segment-title">${title}</div>
      <button class="del-btn" onclick="delSegment(this)">×</button>
    </div>
    <div class="segment-input">
      <label>获取数量</label>
      <input type="number" min="1" value="1" class="seg-count">
    </div>
    <button onclick="getSegmentPhone('${prefix}', this)">获取手机号</button>
    <button class="batch-copy-btn" onclick="copyAllLinks(this)">批量复制全部链接</button>
    <div class="phone-list"></div>
  `;
  grid.appendChild(card);
  document.getElementById('segmentInput').value = '';
}

function delSegment(btn){
  btn.closest('.segment-card').remove();
}

async function getSegmentPhone(prefix, btn){
  const card = btn.closest('.segment-card');
  const countInput = card.querySelector('.seg-count');
  const count = parseInt(countInput.value);
  const listBox = card.querySelector('.phone-list');
  if(!count || count < 1) return alert('请输入有效数量');
  btn.disabled = true;
  btn.innerText = '获取中...';
  for(let i=0; i<count; i++){
    try{
      let url = `${API_BASE}?api=getPhone&token=${API_TOKEN}&sid=${currentSid}`;
      if(prefix) url += `&paragraph=${prefix}`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.code === "0" && data.phone){
        const phone = data.phone;
        const randomKey = Math.random().toString(36).slice(2,10);
        localStorage.setItem('code_'+randomKey, JSON.stringify({phone, sid: currentSid}));
        const link = window.location.origin + window.location.pathname + '?key=' + randomKey;
        const item = document.createElement('div');
        item.className = 'phone-item';
        item.dataset.link = link;
        item.innerHTML = `
          <input readonly value="${phone}">
          <button onclick="copyLink(this,'${link}')">复制链接</button>
        `;
        listBox.appendChild(item);
      }else{
        const item = document.createElement('div');
        item.className = 'phone-item';
        item.innerHTML = `<span style="color:#ef4444;font-size:13px">失败：${data.msg || '未知错误'}</span>`;
        listBox.appendChild(item);
      }
    }catch(e){
      const item = document.createElement('div');
      item.className = 'phone-item';
      item.innerHTML = `<span style="color:#ef4444;font-size:13px">请求失败：${e.message}</span>`;
      listBox.appendChild(item);
    }
  }
  btn.disabled = false;
  btn.innerText = '获取手机号';
}

function copyLink(btn, text){
  navigator.clipboard.writeText(text).then(()=>{
    const old = btn.innerText;
    btn.innerText = '已复制';
    setTimeout(()=> btn.innerText = old, 1500);
  });
}

function copyAllLinks(btn){
  const card = btn.closest('.segment-card');
  const items = card.querySelectorAll('.phone-item[data-link]');
  if(!items.length) return alert('当前号段暂无链接可复制');
  const links = Array.from(items).map(item => item.dataset.link).join('\n');
  navigator.clipboard.writeText(links).then(()=>{
    const old = btn.innerText;
    btn.innerText = '已复制全部';
    setTimeout(()=> btn.innerText = old, 1500);
  });
}

function renderUserPage(key){
  const data = localStorage.getItem('code_'+key);
  if(!data){
    document.body.innerHTML = `<div class="card"><h2 style="color:#ef4444">链接无效或已过期</h2></div>`;
    return;
  }
  const {phone, sid} = JSON.parse(data);
  document.body.innerHTML = `
    <div class="card">
      <h2>获取验证码</h2>
      <div class="form-item">
        <label>手机号</label>
        <input readonly id="phoneBox" value="${phone}">
      </div>
      <div class="form-item">
        <label>验证码</label>
        <input readonly id="codeBox" placeholder="点击下方按钮获取">
      </div>
      <div class="btn-group">
        <button id="getCodeBtn" onclick="getCode('${key}','${sid}')">获取验证码</button>
        <button id="switchBtn" class="switch-btn" onclick="switchPhone('${key}','${sid}')">切换账号</button>
      </div>
      <div id="codeTip" class="tip hidden"></div>
    </div>
  `;
}

async function getCode(key, sid){
  const btn = document.getElementById('getCodeBtn');
  const switchBtn = document.getElementById('switchBtn');
  const tip = document.getElementById('codeTip');
  const codeBox = document.getElementById('codeBox');
  const phone = document.getElementById('phoneBox').value;
  btn.disabled = true;
  btn.innerText = '获取中...';
  tip.className = 'tip hidden';
  codeBox.value = '';
  try{
    const res = await fetch(`${API_BASE}?api=getMessage&token=${API_TOKEN}&sid=${sid}&phone=${phone}`);
    const data = await res.json();
    if(data.code === "0"){
      const verifyCode = data.yzm || data.sms || '';
      if(verifyCode){
        codeBox.value = verifyCode;
        if(data.yzm){
          switchBtn.disabled = true;
          switchBtn.title = '已获取验证码，不可切换账号';
        }
      }else{
        tip.className = 'tip warn';
        tip.innerText = '暂无验证码，短信可能尚未到达，请稍后重试';
      }
    }else{
      tip.className = 'tip error';
      tip.innerText = data.msg || '获取验证码失败';
    }
  }catch(e){
    tip.className = 'tip error';
    tip.innerText = '请求失败：' + e.message;
  }finally{
    btn.disabled = false;
    btn.innerText = '重新获取';
  }
}

async function switchPhone(key, sid){
  const switchBtn = document.getElementById('switchBtn');
  const getCodeBtn = document.getElementById('getCodeBtn');
  const phoneBox = document.getElementById('phoneBox');
  const codeBox = document.getElementById('codeBox');
  const tip = document.getElementById('codeTip');
  const oldPhone = phoneBox.value;
  switchBtn.disabled = true;
  getCodeBtn.disabled = true;
  switchBtn.innerText = '切换中...';
  tip.className = 'tip hidden';
  codeBox.value = '';
  try{
    await fetch(`${API_BASE}?api=cancelRecv&token=${API_TOKEN}&sid=${sid}&phone=${oldPhone}`);
    const res = await fetch(`${API_BASE}?api=getPhone&token=${API_TOKEN}&sid=${sid}`);
    const data = await res.json();
    if(data.code === "0" && data.phone){
      const newPhone = data.phone;
      phoneBox.value = newPhone;
      const storeData = JSON.parse(localStorage.getItem('code_'+key));
      storeData.phone = newPhone;
      localStorage.setItem('code_'+key, JSON.stringify(storeData));
    }else{
      tip.className = 'tip error';
      tip.innerText = '切换失败：' + (data.msg || '未知错误');
    }
  }catch(e){
    tip.className = 'tip error';
    tip.innerText = '切换失败：' + e.message;
  }finally{
    switchBtn.disabled = false;
    getCodeBtn.disabled = false;
    switchBtn.innerText = '切换账号';
  }
}
</script>
</body>
</html>
