<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接码管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">

<div id="loginBox" class="max-w-md w-full bg-neutral-800 p-8 rounded-xl shadow-lg">
  <h2 class="text-2xl font-bold text-center mb-6 text-white">管理员登录</h2>
  <div class="mb-4 text-red-400 hidden" id="loginTip">账号或密码输入错误</div>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">账号</label>
      <input class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" id="usr">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">密码</label>
      <input type="password" class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" id="pwd">
    </div>
    <button onclick="a1b2c3()" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700 transition">登录后台</button>
  </div>
</div>

<div id="adminPanel" class="hidden container mx-auto p-6 max-w-2xl">
  <div class="flex justify-between items-center bg-blue-600 text-white p-4 rounded-lg mb-6">
    <h1 class="text-xl font-bold">接码控制台</h1>
    <button onclick="z9x8y7()" class="bg-white text-blue-600 px-3 py-1 rounded">退出登录</button>
  </div>

  <div class="bg-white p-6 rounded-xl shadow">
    <button onclick="s5d4f6()" class="bg-emerald-600 text-white px-4 py-2 rounded mb-4 hover:bg-emerald-700">1. 获取手机号（调用 API-A）</button>
    
    <div class="mb-5">
      <label class="text-sm font-medium block mb-1">获取到的手机号</label>
      <input readonly id="phoneInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>

    <button onclick="g2h3j4()" class="bg-violet-600 text-white px-4 py-2 rounded mb-4 hover:bg-violet-700">2. 生成用户取码链接</button>

    <div class="mb-2">
      <label class="text-sm font-medium block mb-1">用户访问链接</label>
      <input readonly id="linkInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>
    <div class="text-green-500 text-sm mb-2 hidden" id="copyTip">链接已复制！</div>
    <button onclick="k7l6m5()" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hidden" id="copyBtn">复制链接</button>
  </div>
</div>

<script>
Object.defineProperty(window, 'atob', { configurable: false });
Object.defineProperty(window, 'btoa', { configurable: false });
document.onkeydown = e => {
  if ([123, 73, 85].includes(e.keyCode) && (e.ctrlKey || e.shiftKey)) return false;
};
document.oncontextmenu = () => false;
const _xorKey = 61;
const _b64Table = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
function _b64Dec(s) {
  let out = '', i = 0;
  s = s.replace(/[^A-Za-z0-9\+\/\=]/g, '');
  while (i < s.length) {
    let c1 = _b64Table.indexOf(s[i++]);
    let c2 = _b64Table.indexOf(s[i++]);
    let c3 = _b64Table.indexOf(s[i++]);
    let c4 = _b64Table.indexOf(s[i++]);
    let chr1 = (c1 << 2) | (c2 >> 4);
    let chr2 = ((c2 & 15) << 4) | (c3 >> 2);
    let chr3 = ((c3 & 3) << 6) | c4;
    out += String.fromCharCode(chr1);
    if (c3 !== 64) out += String.fromCharCode(chr2);
    if (c4 !== 64) out += String.fromCharCode(chr3);
  }
  return out;
}
function _xorDec(str) {
  let r = '';
  for (let c of str) r += String.fromCharCode(c.charCodeAt(0) ^ _xorKey);
  return r;
}
const _u = _xorDec('\u001f\u000f\u0006\u001e\u0043\u001c\u0007\u001f\u001c\u0002\u001c');
const _p = _xorDec('\u001f\u000f\u0006\u001e\u0043\u001c\u0007\u001f\u001c\u0002\u001c\u003d\u003d\u0038\u0039\u003d\u0038');
const _t = _xorDec('\u002b\u0021\u0035\u0021\u000e\u002c\u000e\u000e\u002c\u0016\u0045\u001a\u0027\u0027\u0022\u0022\u0022\u0045\u002c\u001a\u0027\u0016\u002b\u002c\u0022\u001a\u0022\u000f\u001a\u002c');
const _a = _xorDec('\u002c\u002b\u002b\u000f\u0015\u007f\u007f\u002b\u000f\u0018\u0013\u007b\u001f\u001e\u001a\u001a\u001c\u007b\u0013\u001e\u0011');
const U = _b64Dec(_u);
const P = _b64Dec(_p);
const T = _b64Dec(_t);
const A = _b64Dec(_a);
const KW = "%e5%8f%a4%e6%80%aa%e5%8a%a0%e9%80%9f%e5%99%a8";
let _tel = "";
let _rk = "";
function a1b2c3(){
  const iU = document.getElementById('usr').value.trim();
  const iP = document.getElementById('pwd').value.trim();
  if(iU === U && iP === P){
    sessionStorage.setItem('adm1n', 'ok');
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    document.getElementById('loginTip').classList.add('hidden');
  }else{
    document.getElementById('loginTip').classList.remove('hidden');
  }
}
function z9x8y7(){
  sessionStorage.removeItem('adm1n');
  location.reload();
}
window.onload = () => {
  const p = new URLSearchParams(location.search);
  const k = p.get('key');
  if(k) return renderPage(k);
  if(sessionStorage.getItem('adm1n') === 'ok'){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  }
};
async function s5d4f6() {
  const btn = document.activeElement;
  btn.disabled = true;
  btn.innerText = "获取中...";
  try {
    const url = `${A}?code=getPhone&token=${T}&keyWord=${KW}&cardType=全部`;
    const res = await fetch(url);
    const text = await res.text();
    _tel = text.trim();
    document.getElementById('phoneInput').value = _tel;
    _rk = Math.random().toString(36).slice(2,10);
    localStorage.setItem('t_' + _rk, _tel);
  } catch (err) {
    alert("获取手机号失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "1. 获取手机号（调用 API-A）";
  }
}
function g2h3j4() {
  if(!_tel) return alert("请先获取手机号！");
  const base = window.location.origin + window.location.pathname;
  const link = `${base}?key=${_rk}`;
  document.getElementById('linkInput').value = link;
  document.getElementById('copyBtn').classList.remove('hidden');
}
async function k7l6m5() {
  await navigator.clipboard.writeText(document.getElementById('linkInput').value);
  document.getElementById('copyTip').classList.remove('hidden');
  setTimeout(()=>document.getElementById('copyTip').classList.add('hidden'),2000);
}
function renderPage(key) {
  const phone = localStorage.getItem('t_' + key);
  if(!phone) {
    document.body.innerHTML = `<div class="flex h-screen items-center justify-center text-red-500 text-lg bg-slate-900 text-white">链接无效或已过期</div>`;
    return;
  }
  document.body.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
    <div class="max-w-md w-full bg-white p-7 rounded-xl shadow-lg">
      <h2 class="text-xl font-bold text-center mb-6">获取验证码</h2>
      <div class="mb-4">
        <label class="text-sm block mb-1">手机号</label>
        <input readonly value="${phone}" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <div class="mb-6">
        <label class="text-sm block mb-1">验证码</label>
        <input readonly id="codeBox" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <button onclick="getMsgFromAPI('${phone}')" id="getBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">获取验证码</button>
    </div>
  </div>
  `;
}
async function getMsgFromAPI(phone) {
  const btn = document.getElementById('getBtn');
  btn.disabled = true;
  btn.innerText = "正在获取...";
  try {
    const url = `${A}?code=getMsg&token=${T}&keyWord=${KW}&phone=${phone}`;
    const res = await fetch(url);
    const msg = await res.text();
    document.getElementById('codeBox').value = msg.trim();
  } catch (err) {
    alert("获取验证码失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "获取验证码";
  }
}
</script>
</body>
</html>
