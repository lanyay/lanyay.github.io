<script src="./main.js"></script>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接码管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- 登录面板 -->
<div id="loginBox" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-lg">
  <h2 class="text-2xl font-bold text-center mb-6">管理员登录</h2>
  <div class="mb-4 text-red-500 hidden" id="loginTip">账号密码错误</div>
  <div class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">账号</label>
      <input class="w-full border px-3 py-2 rounded" id="usr" value="admin">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">密码</label>
      <input type="password" class="w-full border px-3 py-2 rounded" id="pwd" value="123456">
    </div>
    <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">登录后台</button>
  </div>
</div>

<!-- 管理员控制台 -->
<div id="adminPanel" class="hidden container mx-auto p-6 max-w-2xl">
  <div class="flex justify-between items-center bg-blue-600 text-white p-4 rounded-lg mb-6">
    <h1 class="text-xl font-bold">接码控制台</h1>
    <button onclick="logout()" class="bg-white text-blue-600 px-3 py-1 rounded">退出登录</button>
  </div>

  <div class="bg-white p-6 rounded-xl shadow">
    <button onclick="getPhoneFromAPI()" class="bg-emerald-600 text-white px-4 py-2 rounded mb-4 hover:bg-emerald-700">1. 获取手机号（调用 API-A）</button>
    
    <div class="mb-5">
      <label class="text-sm font-medium block mb-1">获取到的手机号</label>
      <input readonly id="phoneInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>

    <button onclick="genUserUrl()" class="bg-violet-600 text-white px-4 py-2 rounded mb-4 hover:bg-violet-700">2. 生成用户取码链接</button>

    <div class="mb-2">
      <label class="text-sm font-medium block mb-1">用户访问链接</label>
      <input readonly id="linkInput" class="w-full border bg-gray-100 px-3 py-2 rounded">
    </div>
    <div class="text-green-500 text-sm mb-2 hidden" id="copyTip">链接已复制！</div>
    <button onclick="copyUrl()" class="bg-gray-700 text-white px-3 py-1 rounded text-sm hidden" id="copyBtn">复制链接</button>
  </div>
</div>

<script>
let currentPhone = "";
let randomKey = "";
const token = "95a50600291b44999405b89a122cfd30";

// 登录
function login(){
  const u = document.getElementById('usr').value;
  const p = document.getElementById('pwd').value;
  if(u === "admin" && p === "123456"){
    localStorage.setItem('isAdmin', '1');
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  }else{
    document.getElementById('loginTip').classList.remove('hidden');
  }
}

// 退出
function logout(){
  localStorage.removeItem('isAdmin');
  location.reload();
}

// 页面初始化
window.onload = () => {
  const params = new URLSearchParams(location.search);
  const pageKey = params.get("key");
  if(pageKey){
    renderUserPage(pageKey);
    return;
  }
  if(localStorage.getItem('isAdmin') === '1'){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
  }
};

// ======================
// 调用真实 API A 获取手机号
// ======================
async function getPhoneFromAPI() {
  const btn = document.activeElement;
  btn.disabled = true;
  btn.innerText = "获取中...";

  try {
    const url = `https://api.eomsg.com/zc/data.php?code=getPhone&token=${token}&keyWord=%e9%aa%8c%e8%af%81%e7%a0%81&cardType=全部`;
    const res = await fetch(url);
    const text = await res.text();
    currentPhone = text.trim();
    document.getElementById('phoneInput').value = currentPhone;

    randomKey = Math.random().toString(36).slice(2,10);
    localStorage.setItem('tel_' + randomKey, currentPhone);
  } catch (err) {
    alert("获取失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "1. 获取手机号（调用 API-A）";
  }
}

// 生成用户链接
function genUserUrl() {
  if(!currentPhone) {
    alert("请先获取手机号！");
    return;
  }
  const base = window.location.origin + window.location.pathname;
  const userUrl = `${base}?key=${randomKey}`;
  document.getElementById('linkInput').value = userUrl;
  document.getElementById('copyBtn').classList.remove('hidden');
}

// 复制链接
async function copyUrl() {
  await navigator.clipboard.writeText(document.getElementById('linkInput').value);
  document.getElementById('copyTip').classList.remove('hidden');
  setTimeout(()=>document.getElementById('copyTip').classList.add('hidden'),2000);
}

// ======================
// 用户页面：调用真实 API B 获取验证码
// ======================
function renderUserPage(key) {
  const phone = localStorage.getItem('tel_' + key);
  if(!phone) {
    document.body.innerHTML = `<div class="flex h-screen items-center justify-center text-red-500 text-lg">链接无效</div>`;
    return;
  }

  document.body.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
    <div class="max-w-md w-full bg-white p-7 rounded-xl shadow-lg">
      <h2 class="text-xl font-bold text-center mb-6">获取验证码</h2>
      <div class="mb-4">
        <label class="text-sm block mb-1">手机号</label>
        <input readonly value="${phone}" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <div class="mb-6">
        <label class="text-sm block mb-1">验证码</label>
        <input readonly id="codeBox" class="w-full bg-gray-100 border px-3 py-2 rounded">
      </div>
      <button onclick="getMsgFromAPI('${phone}')" id="getBtn" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">获取验证码</button>
    </div>
  </div>
  `;
}

async function getMsgFromAPI(phone) {
  const btn = document.getElementById('getBtn');
  btn.disabled = true;
  btn.innerText = "正在获取...";

  try {
    const url = `https://api.eomsg.com/zc/data.php?code=getMsg&token=${token}&phone=${phone}&keyWord=%e9%aa%8c%e8%af%81%e7%a0%81`;
    const res = await fetch(url);
    const msg = await res.text();
    document.getElementById('codeBox').value = msg.trim();
  } catch (err) {
    alert("获取失败：" + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = "获取验证码";
  }
}
</script>
</body>
</html>
