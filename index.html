<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接码管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing: border-box;}
body{background:#121212;color:#fff;margin:0;padding:20px;font-size:15px;}
.wrap{max-width:580px;margin:30px auto;border:1px solid #303030;padding:24px;border-radius:10px;}
input,button{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:none;outline:none;}
input{background:#1e1e1e;color:#fff;border:1px solid #444;}
button{cursor:pointer;font-size:15px;}
.primary{background:#2563eb;color:#fff;}
.success{background:#16a34a;color:#fff;}
.warn{background:#ea580c;color:#fff;}
.danger{background:#dc2626;color:#fff;}
button:disabled{opacity:0.6;cursor:not-allowed;}
.link-box{border:1px solid #444;padding:12px;border-radius:6px;margin-top:10px;min-height:80px;}
.set-box{border:1px dashed #666;padding:12px;border-radius:6px;margin-bottom:12px;}
.tip-red{color:#ff5555;font-size:14px;}
.url-box{background:#1a1a1a;border:1px solid #555;padding:10px;border-radius:4px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#60a5fa;line-height:1.8;}
</style>
</head>
<body>
<div id="visitor-container" style="display:none;">
    <div class="wrap">
        <h2 class="text-center text-lg mb-4">取码页面</h2>
        <p>绑定手机号：<span id="vis-phone"></span></p>
        <button onclick="visitorGetCode()" class="primary mt-2">获取验证码</button>
        <p id="vis-code" class="mt-3"></p>
    </div>
</div>
<div id="admin-container">
    <div class="wrap" id="login-module">
        <h2 class="text-center text-lg mb-4">管理员登录</h2>
        <input id="admin-user" placeholder="输入账号">
        <input id="admin-pass" type="password" placeholder="输入密码">
        <p class="tip-red" id="login-tip"></p>
        <button onclick="adminLogin()" class="primary">登录系统</button>
    </div>
    <div class="wrap" id="control-module" style="display:none;">
        <h2 class="text-center text-lg mb-4">管理员控制台</h2>
        <div class="set-box">
            <p>设置一次性批量获取手机号数量</p>
            <input type="number" id="setTimesInput" min="1" placeholder="输入数字">
            <button onclick="setBatchNum()" class="danger mt-2">确认批量数量</button>
        </div>
        <p>本次批量获取目标数量：<span id="batchNumText">未设置</span></p>
        <button id="btn-get-phone" onclick="batchGetPhone()" class="primary mt-2">一键批量获取全部手机号</button>
        <div class="link-box" id="link-area" style="display:none;">
            <p>批量生成的永久访问链接列表：</p>
            <div class="url-box" id="urlListBox"></div>
        </div>
        <p class="mt-4">当前验证码：<span id="admin-code">暂无</span></p>
        <button id="btn-get-code" onclick="fetchVerifyCode()" class="warn mt-2">获取验证码</button>
    </div>
</div>
<script>
const decode64 = s => atob(s);
const CONFIG = {
    username: decode64("TGF6eUJpS2luZw=="),
    password: decode64("TGF6eUJpS2luZzExNDUxNA=="),
    apiUrl: decode64("aHR0cHM6Ly9hcGkuZW9tc2cuY29tL3pjL2RhdGEucGhw"),
    token: decode64("OTVhNTA2MDAyOTFiNDQ5OTk0MDViODlhMTIyY2ZkMzA="),
    keyword: "%E5%8F%A4%E6%80%AA%E5%8A%A0%E9%80%9F%E5%99%A8"
};
let storedPhone = "";
let finishCode = false;
let visitorBindPhone = "";
let batchCount = 0;
(function initPage(){
    const urlParam = new URLSearchParams(location.search);
    visitorBindPhone = urlParam.get("phone");
    if(visitorBindPhone){
        document.getElementById("admin-container").style.display = "none";
        document.getElementById("visitor-container").style.display = "block";
        document.getElementById("vis-phone").innerText = visitorBindPhone;
        return;
    }
})();
function adminLogin(){
    const inputUser = document.getElementById("admin-user").value.trim();
    const inputPass = document.getElementById("admin-pass").value.trim();
    const tipDom = document.getElementById("login-tip");
    tipDom.innerText = "";
    if(inputUser === CONFIG.username && inputPass === CONFIG.password){
        document.getElementById("login-module").style.display = "none";
        document.getElementById("control-module").style.display = "block";
    }else{
        tipDom.innerText = "账号或密码错误";
    }
}
function setBatchNum(){
    const num = parseInt(document.getElementById("setTimesInput").value);
    if(isNaN(num)||num<1){
        alert("请输入大于0的整数");
        return;
    }
    batchCount = num;
    document.getElementById("batchNumText").innerText = batchCount;
    document.getElementById("urlListBox").innerText = "";
    document.getElementById("link-area").style.display = "none";
    document.getElementById("btn-get-phone").disabled = false;
    alert("批量获取数量已设置完成");
}
async function batchGetPhone(){
    if(batchCount <= 0){
        alert("请先设置批量获取数量");
        return;
    }
    document.getElementById("btn-get-phone").disabled = true;
    document.getElementById("urlListBox").innerText = "";
    document.getElementById("link-area").style.display = "block";
    let allLinks = "";
    for(let i=0;i<batchCount;i++){
        const res = await fetch(`${CONFIG.apiUrl}?code=getPhone&token=${CONFIG.token}&keyWord=${CONFIG.keyword}&cardType=全部`);
        const phone = await res.text();
        if(!phone) continue;
        const link = `${location.origin}${location.pathname}?phone=${phone}`;
        allLinks += link + "\n";
    }
    document.getElementById("urlListBox").innerText = allLinks;
    document.getElementById("btn-get-phone").disabled = false;
    alert("批量获取完成");
}
function fetchVerifyCode(){
    if(!storedPhone) return alert("请先批量获取手机号");
    if(finishCode) return alert("已获取有效6位验证码");
    const req = `${CONFIG.apiUrl}?code=getMsg&token=${CONFIG.token}&phone=${storedPhone}&keyWord=${CONFIG.keyword}`;
    fetch(req)
    .then(res=>res.text())
    .then(code=>{
        const codeText = code.trim();
        document.getElementById("admin-code").innerText = codeText;
        if(/^\d{6}$/.test(codeText)){
            finishCode = true;
            document.getElementById("btn-get-code").disabled = true;
            alert("成功获取6位数字验证码");
        }
    })
    .catch(()=>alert("验证码请求失败"));
}
function visitorGetCode(){
    const req = `${CONFIG.apiUrl}?code=getMsg&token=${CONFIG.token}&phone=${visitorBindPhone}&keyWord=${CONFIG.keyword}`;
    fetch(req)
    .then(res=>res.text())
    .then(code=>{
        document.getElementById("vis-code").innerText = "验证码：" + code;
    })
    .catch(()=>{
        document.getElementById("vis-code").innerText = "请求异常，获取失败";
    });
}
document.oncontextmenu = ()=>false;
document.onkeydown = e => {
    if(e.key === "F12" || (e.ctrlKey && e.key === "u") || (e.ctrlKey && e.shiftKey && e.key === "I")){
        return false;
    }
}
</script>
</body>
</html>
