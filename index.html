<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接码管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(145deg,#0b101f,#121a33);color:#e8edf3;min-height:100vh;padding:2rem 1rem;font-size:15px;font-family:"Microsoft Yahei",system-ui,-apple-system,sans-serif}
.main-card{max-width:640px;margin:0 auto;background:rgba(22,28,45,.95);border:1px solid rgba(80,120,255,.2);border-radius:20px;padding:32px;box-shadow:0 10px 40px rgba(0,0,0,.4),0 0 0 1px rgba(60,100,220,.08);backdrop-filter:blur(8px);transition:.3s ease}
.main-card:hover{box-shadow:0 12px 48px rgba(0,0,0,.5),0 0 0 1px rgba(70,130,255,.15)}
.title-text{font-size:24px;font-weight:600;text-align:center;margin-bottom:28px;color:#fff;letter-spacing:2px;text-shadow:0 2px 8px rgba(59,130,246,.3)}
.block-box{border:1px dashed rgba(100,140,255,.25);padding:20px;border-radius:14px;margin-bottom:22px;background:rgba(40,50,80,.2)}
.link-wrap{border:1px solid rgba(80,120,255,.25);padding:18px;border-radius:14px;margin-top:18px;background:rgba(30,40,70,.25);min-height:100px}
.label-text{font-size:14px;color:#b4c2e0;margin-bottom:10px;display:block}
.input-field{width:100%;padding:14px 16px;margin:8px 0;border-radius:12px;border:none;outline:none;background:rgba(28,38,64,.8);color:#f0f4ff;border:1px solid rgba(90,130,255,.2);font-size:15px;transition:.25s ease}
.input-field:focus{border-color:rgba(59,130,246,.6);box-shadow:0 0 0 3px rgba(59,130,246,.18);background:rgba(32,44,72,.9)}
.btn{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:none;outline:none;cursor:pointer;font-size:15px;font-weight:500;transition:.25s ease}
.btn-primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff}
.btn-primary:hover{opacity:.94;transform:translateY(-2px);box-shadow:0 6px 18px rgba(59,130,246,.35)}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
.btn-danger:hover{opacity:.94;transform:translateY(-2px);box-shadow:0 6px 18px rgba(239,68,.35)}
.btn-warn{background:linear-gradient(135deg,#ea580c,#fb923c);color:#fff}
.btn-warn:hover{opacity:.94;transform:translateY(-2px);box-shadow:0 6px 18px rgba(249,115,22,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.url-scroll-box{background:rgba(20,28,48,.9);border:1px solid rgba(80,120,255,.2);padding:16px;border-radius:10px;max-height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;color:#84b8ff;line-height:2;font-size:14px}
.url-scroll-box::-webkit-scrollbar{width:7px}
.url-scroll-box::-webkit-scrollbar-thumb{background:rgba(100,140,255,.35);border-radius:4px}
.url-scroll-box::-webkit-scrollbar-track{background:rgba(25,35,60,.4)}
.code-normal{font-size:18px;color:#e8edf3;font-weight:500}
.code-red{color:#ff4d4f;font-size:20px;font-weight:700;letter-spacing:1px;text-shadow:0 0 6px rgba(255,77,79,.3)}
.tip-small{color:#94a3c2;font-size:14px;margin:6px 0 12px}
.tip-error{color:#ff6b6b}
.mt-5{margin-top:24px}
</style>
</head>
<body>
<div id="vC" style="display:none;">
    <div class="main-card">
        <h2 class="title-text">取码页面</h2>
        <p class="label-text">绑定手机号：<span id="vp" class="code-normal"></span></p>
        <button onclick="vG()" class="btn btn-primary mt-2">获取验证码</button>
        <p id="vc" class="mt-5 tip-small"></p>
    </div>
</div>
<div id="aC">
    <div class="main-card" id="lM">
        <h2 class="title-text">管理员登录</h2>
        <input class="input-field" id="au" placeholder="输入管理员账号">
        <input class="input-field" id="ap" type="password" placeholder="输入登录密码">
        <p class="tip-small tip-error" id="lt"></p>
        <button onclick="aL()" class="btn btn-primary">登录系统</button>
    </div>
    <div class="main-card" id="cM" style="display:none;">
        <h2 class="title-text">管理员控制台</h2>
        <div class="block-box">
            <p class="label-text">设置一次性批量获取手机号数量</p>
            <input class="input-field" type="number" id="sT" min="1" placeholder="输入数字，例如 10">
            <button onclick="sB()" class="btn btn-danger">确认批量数量</button>
        </div>
        <p class="tip-small">本次批量获取目标数量：<span id="bN">未设置</span></p>
        <button id="bp" onclick="bP()" class="btn btn-primary">一键批量获取全部手机号</button>
        <div class="link-wrap" id="lA" style="display:none;">
            <p class="label-text">批量生成的永久访问链接（无手机号泄露）：</p>
            <div class="url-scroll-box" id="uL"></div>
        </div>
        <p class="mt-5 label-text">当前验证码：<span id="ac" class="code-normal">暂无</span></p>
        <button id="fc" onclick="fV()" class="btn btn-warn">获取验证码</button>
    </div>
</div>
<script>
const d64=s=>atob(s);
const C={
    u:d64("TGF6eUJpS2luZw=="),
    p:d64("TGF6eUJpS2luZzExNDUxNA=="),
    a:d64("aHR0cHM6Ly9hcGkuZW9tc2cuY29tL3pjL2RhdGEucGhw"),
    t:d64("OTVhNTA2MDAyOTFiNDQ5OTk0MDViODlhMTIyY2ZkMzA="),
    // 仅保留网易编码，删除加速器编码
    k:"%E7%BD%91%E6%98%93",
    k1:d64("QWRtaW5Db2RlMjAyNlNlY3JldEtleQ=="),
    k2:d64("U2lnbkRlY3JldDIwMjZDb2Rl"),
    te:300
};
let sP="",fC=!1,vP="",bC=0,aT="",tC=0;
function eP(p){let e=CryptoJS.AES.encrypt(p,C.k1).toString();return btoa(e).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"")}
function dI(i){try{let r=i.replace(/-/g,"+").replace(/_/g,"/");let e=atob(r);return CryptoJS.AES.decrypt(e,C.k1).toString(CryptoJS.enc.Utf8)}catch{return""}}
function cS(pa,ts,n){let s="";Object.keys(pa).sort().forEach(k=>s+=k+"="+pa[k]+"&");s+="timestamp="+ts+"&nonce="+n+"&secret="+C.k2;return CryptoJS.MD5(s).toString()}
function gT(){let ts=Math.floor(Date.now()/1e3);let r=ts+"_"+Math.random().toString(36).slice(2,14);aT=btoa(r);tC=ts}
function cT(){return Math.floor(Date.now()/1e3)-tC>C.te}
setInterval(()=>gT(),C.te*1e3-3e4);
!function(){let o=!1,t=160;function c(){let w=window.outerWidth-window.innerWidth,h=window.outerHeight-window.innerHeight;if(w>t||h>t){o=!0;location.href="https://www.bilibili.com"}}window.addEventListener("resize",c);setInterval(c,400);let h=setInterval(()=>{let s=performance.now();debugger;let e=performance.now();if(e-s>100){clearInterval(h);location.href="https://www.bilibili.com"}},1e3)}();
!function(){gT();let u=new URLSearchParams(location.search);let i=u.get("id");if(i){vP=dI(i);if(!vP||!/^\d{11}$/.test(vP)){document.body.innerHTML="<div style='text-align:center;margin-top:80px;color:#ff4d4f;font-size:20px;'>无效访问链接，禁止进入</div>";return}document.getElementById("aC").style.display="none";document.getElementById("vC").style.display="block";document.getElementById("vp").innerText=vP;return}}();
function aL(){
let au=document.getElementById("au").value.trim();
let ap=document.getElementById("ap").value.trim();
let t=document.getElementById("lt");
t.innerText="";
au===C.u&&ap===C.p?(document.getElementById("lM").style.display="none",document.getElementById("cM").style.display="block"):t.innerText="账号或密码错误，请重新输入"
}
function sB(){let n=parseInt(document.getElementById("sT").value);if(isNaN(n)||n<1){alert("请输入大于0的整数");return}bC=n;document.getElementById("bN").innerText=bC;document.getElementById("uL").innerText="";document.getElementById("lA").style.display="none";document.getElementById("bp").disabled=!1;alert("批量获取数量已设置完成")}
async function bP(){if(bC<=0){alert("请先设置批量获取数量");return}if(cT()){gT();alert("身份凭证已刷新，请重新点击");return}document.getElementById("bp").disabled=!0;document.getElementById("uL").innerText="";document.getElementById("lA").style.display="block";let l="";for(let i=0;i<bC;i++){let ts=Math.floor(Date.now()/1e3),n=Math.random().toString(36).slice(2,12);let pa={code:"getPhone",token:C.t,keyWord:C.k,cardType:"全部"};let s=cS(pa,ts,n);let r=await fetch(`${C.a}?code=${pa.code}&token=${pa.token}&keyWord=${pa.keyWord}&cardType=${pa.cardType}&accessToken=${aT}&timestamp=${ts}&nonce=${n}&sign=${s}`);let ph=(await r.text()).trim();if(!ph||!/^\d{11}$/.test(ph))continue;let id=eP(ph);l+=`${location.origin}${location.pathname}?id=${id}\n`}document.getElementById("uL").innerText=l;document.getElementById("bp").disabled=!1;alert("批量获取完成，链接可跨设备访问")}
function fV(){if(!sP){alert("请先批量获取手机号");return}if(fC){alert("已获取验证码，不可重复点击");return}if(cT()){gT();alert("身份凭证已刷新，请重新点击");return}let ts=Math.floor(Date.now()/1e3),n=Math.random().toString(36).slice(2,12);let pa={code:"getMsg",token:C.t,phone:sP,keyWord:C.k};let s=cS(pa,ts,n);fetch(`${C.a}?code=${pa.code}&token=${pa.token}&phone=${pa.phone}&keyWord=${pa.keyWord}&accessToken=${aT}&timestamp=${ts}&nonce=${n}&sign=${s}`).then(r=>r.text()).then(c=>{let t=c.trim(),d=document.getElementById("ac");if(/^\d{5}$/.test(t)){d.className="code-red";d.innerText=t;fC=!0;document.getElementById("fc").disabled=!0;alert(`您的验证码是${t}`)}else if(/^\d{6}$/.test(t)){d.className="code-normal";d.innerText=t;fC=!0;document.getElementById("fc").disabled=!0;alert("成功获取6位数字验证码")}else{d.className="code-normal";d.innerText=t}}).catch(()=>alert("验证码请求失败"))}
function vG(){let ts=Math.floor(Date.now()/1e3),n=Math.random().toString(36).slice(2,12);let pa={code:"getMsg",token:C.t,phone:vP,keyWord:C.k};let s=cS(pa,ts,n);fetch(`${C.a}?code=${pa.code}&token=${pa.token}&phone=${pa.phone}&keyWord=${pa.keyWord}&accessToken=${aT}&timestamp=${ts}&nonce=${n}&sign=${s}`).then(r=>r.text()).then(c=>document.getElementById("vc").innerText="验证码："+c).catch(()=>document.getElementById("vc").innerText="请求异常，获取失败")}
document.oncontextmenu=()=>!1;document.onkeydown=e=>{if(e.key==="F12"||(e.ctrlKey&&e.key==="u")||(e.ctrlKey&&e.key==="I"))return!1}
</script>
</body>
</html>
