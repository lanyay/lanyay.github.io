<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接码管理系统</title>
    <!-- Tailwind样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AES加密库 crypto-js -->
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
    <div id="loginBox" class="max-w-md w-full bg-neutral-800 p-8 rounded-xl shadow-xl">
        <h2 class="text-2xl font-bold text-center mb-6 text-white">管理员登录</h2>
        <div id="loginTip" class="mb-4 text-red-400 hidden">账号或密码输入错误</div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">账号</label>
                <input id="usr" class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" placeholder="请输入账号">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">密码</label>
                <input type="password" id="pwd" class="w-full border border-gray-600 bg-neutral-700 text-white px-3 py-2 rounded outline-none focus:border-blue-500" placeholder="请输入密码">
            </div>
            <button onclick="a1b2c3()" class="w-full bg-blue-500 text-white py-3 rounded hover:bg-blue-600 transition">登录后台</button>
        </div>
    </div>

    <script>
        // AES加密密钥（前后端统一，自行更换32位字符串）
        const AES_KEY = CryptoJS.enc.Utf8.parse("1234567890abcdef1234567890abcdef");
        const AES_IV = CryptoJS.enc.Utf8.parse("1234567890abcdef");

        // AES加密方法
        function aesEncrypt(text) {
            const encrypted = CryptoJS.AES.encrypt(text, AES_KEY, {
                iv: AES_IV,
                mode: CryptoJS.mode.CBC,
                padding: CryptoJS.pad.Pkcs7
            });
            return encrypted.toString();
        }

        // 登录点击事件
        function a1b2c3() {
            alert('进入登录函数');
            // 获取输入框原始账号密码
            const U = document.getElementById('usr').value.trim();
            const P = document.getElementById('pwd').value.trim();
            
            // 打印原始明文
            console.log("原始账号：", U);
            console.log("原始密码：", P);

            // 非空校验
            if (!U || !P) {
                showTip("账号密码不能为空！");
                return;
            }

            // AES加密账号、密码
            const encryptUser = aesEncrypt(U);
            const encryptPwd = aesEncrypt(P);
            console.log("加密后账号：", encryptUser);
            console.log("加密后密码：", encryptPwd);

            // 弹窗查看加密结果
            alert(`明文账号：${U}\n加密账号：${encryptUser}\n\n明文密码：${P}\n加密密码：${encryptPwd}`);

            // 调用后端API（替换成你的真实接口地址）
            const apiUrl = "https://你的后端登录api地址/login";
            fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: encryptUser,
                    password: encryptPwd
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.code === 200) {
                    // 登录成功，跳转后台页面
                    window.location.href = "admin.html";
                } else {
                    showTip(data.msg || "账号或密码输入错误");
                }
            })
            .catch(err => {
                console.error("接口请求失败：", err);
                showTip("服务器连接失败，请稍后重试");
            });
        }

        // 展示错误提示
        function showTip(msg) {
            const tipDom = document.getElementById("loginTip");
            tipDom.innerText = msg;
            tipDom.classList.remove("hidden");
        }
    </script>
</body>
</html>
