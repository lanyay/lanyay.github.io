<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取验证码</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-md p-6 w-full max-w-md">
        <h2 class="text-xl font-bold text-center text-gray-800 mb-6">验证码获取</h2>
        
        <!-- 手机号（只读） -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">手机号</label>
            <input type="text" id="phone" readonly class="w-full px-4 py-2 border bg-gray-100 rounded-md">
        </div>

        <!-- 验证码 -->
        <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
            <input type="text" id="code" readonly class="w-full px-4 py-2 border bg-gray-100 rounded-md">
        </div>

        <!-- 获取按钮 -->
        <button id="getCode" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition-colors font-medium">获取验证码</button>
    </div>

    <script>
        // 获取当前页面随机码
        const path = window.location.pathname;
        const code = path.split('/').pop().replace('.html', '');
        const phone = localStorage.getItem(`page_${code}`);

        if (!phone) {
            document.body.innerHTML = '<div class="text-center text-red-500 p-10">页面不存在或已过期</div>';
        } else {
            document.getElementById('phone').value = phone;
        }

        // 获取验证码（调用 API B）
        document.getElementById('getCode').addEventListener('click', async () => {
            const btn = document.getElementById('getCode');
            btn.disabled = true;
            btn.textContent = '获取中...';

            try {
                // 模拟 API B 请求
                await new Promise(resolve => setTimeout(resolve, 1500));
                const verifyCode = Math.floor(100000 + Math.random() * 900000).toString();
                document.getElementById('code').value = verifyCode;
            } catch (err) {
                alert('获取失败：' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '获取验证码';
            }
        });
    </script>
</body>
</html>
